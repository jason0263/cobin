<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Cobin Voice & Video - 即時通話</title>
    <style>
        :root {
            --bg-base: #0c0e14;
            --bg-sidebar: #131722;
            --bg-channel: #181d2c;
            --bg-card: #1c2234;
            --bg-glass: rgba(20, 24, 38, 0.75);
            --bg-glass-btn: rgba(255, 255, 255, 0.12);
            --bg-glass-btn-hover: rgba(255, 255, 255, 0.22);
            
            --accent: #5865f2;
            --accent-hover: #4752c4;
            --accent-green: #23a55a;
            --accent-red: #f23f43;
            --accent-red-hover: #da373b;
            
            --text-primary: #f2f3f5;
            --text-secondary: #949ba4;
            --text-muted: #6d737e;
            
            --border: rgba(255, 255, 255, 0.08);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            
            --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.5);
            --font: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 12px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font);
            height: 100%;
            height: -webkit-fill-available;
            overflow: hidden;
            display: flex;
        }

        /* 伺服器圖示欄 */
        .server-rail {
            width: 72px;
            background: #090a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 0;
            gap: 12px;
            border-right: 1px solid var(--border);
            z-index: 10;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-full);
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .server-icon.active, .server-icon:hover {
            border-radius: 16px;
            background: var(--accent);
        }

        .server-icon svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }

        .server-divider {
            width: 32px;
            height: 2px;
            background: var(--border);
            border-radius: 1px;
        }

        /* 側邊欄 */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            z-index: 20;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .sidebar-header {
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 15px;
        }

        .status-badge-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .channels-list {
            flex: 1;
            padding: 16px 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .category-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 8px 8px 4px 8px;
        }

        .room-item {
            display: flex;
            flex-direction: column;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.18s ease;
            background: transparent;
            border: 1px solid transparent;
        }

        .room-item:hover, .room-item:active {
            background: var(--bg-channel);
            color: #fff;
        }

        .room-item.active {
            background: rgba(88, 101, 242, 0.18);
            border: 1px solid rgba(88, 101, 242, 0.4);
            color: #fff;
        }

        .room-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 14px;
        }

        .room-icon {
            width: 20px;
            height: 20px;
            color: var(--text-secondary);
        }

        .room-item.active .room-icon {
            color: var(--accent-green);
            animation: pulse-wave 1.5s infinite;
        }

        @keyframes pulse-wave {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.18); opacity: 0.8; }
        }

        .room-count-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: var(--radius-full);
            background: rgba(255,255,255,0.08);
            color: var(--text-secondary);
        }

        .room-item.active .room-count-badge {
            background: var(--accent-green);
            color: #fff;
        }

        .room-users-sublist {
            margin-top: 6px;
            padding-left: 30px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .room-user-tag {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
        }

        .user-profile-bar {
            height: 62px;
            background: #0e111a;
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border);
        }

        .user-profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .user-avatar-sm {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            position: relative;
        }

        .user-avatar-sm::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-green);
            border: 2px solid #0e111a;
        }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 15;
        }

        /* 主通話舞台 */
        .main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at center 40%, #151b2a 0%, #0c0e14 100%);
            overflow: hidden;
            height: 100%;
        }

        /* 頂部導覽列 (全局永遠顯示狀態) */
        .global-top-bar {
            position: absolute;
            top: 14px;
            right: 16px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .global-status-pill {
            background: rgba(12, 14, 20, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .stage-header {
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            background: rgba(12, 14, 20, 0.7);
            z-index: 4;
        }

        .stage-room-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 700;
        }

        .btn-menu-mobile {
            display: none;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .call-duration {
            font-size: 12px;
            font-weight: 500;
            color: var(--accent-green);
            background: rgba(35, 165, 90, 0.15);
            padding: 3px 8px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 大廳畫面 */
        .lobby-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-align: center;
            padding: 24px;
            overflow-y: auto;
        }

        .lobby-icon-box {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(88, 101, 242, 0.2), rgba(118, 75, 162, 0.2));
            border: 1px solid rgba(88, 101, 242, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            box-shadow: 0 10px 30px rgba(88, 101, 242, 0.25);
            animation: float-anim 3s ease-in-out infinite;
        }

        @keyframes float-anim {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .lobby-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .lobby-desc {
            font-size: 13px;
            color: var(--text-secondary);
            max-width: 380px;
            line-height: 1.6;
        }

        .lobby-room-cards {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 480px;
        }

        .lobby-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1 1 140px;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .lobby-card:hover, .lobby-card:active {
            transform: translateY(-2px);
            border-color: var(--accent);
            background: #22293e;
        }

        /* 視訊 Grid 區域 */
        .video-grid-container {
            flex: 1;
            padding: 14px 14px calc(90px + var(--safe-bottom)) 14px;
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            align-content: center;
            justify-content: center;
            overflow-y: auto;
            height: 100%;
        }

        .video-grid-container.single-user {
            grid-template-columns: minmax(280px, 800px);
        }

        .video-tile {
            position: relative;
            background: #0f131d;
            border-radius: var(--radius-lg);
            overflow: hidden;
            aspect-ratio: 16 / 9;
            box-shadow: var(--shadow-lg);
            border: 2px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-tile.speaking {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(35, 165, 90, 0.4);
        }

        .video-tile video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-tile.is-local:not(.is-screen) video {
            transform: scaleX(-1);
        }

        .video-tile .avatar-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1e263c 0%, #0d111a 100%);
            gap: 10px;
            z-index: 1;
        }

        .avatar-circle-lg {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 3px solid rgba(255,255,255,0.12);
        }

        .avatar-name-lg {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .video-tag {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 500;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 2;
        }

        .mic-status-icon {
            width: 14px;
            height: 14px;
            color: var(--accent-green);
        }

        .mic-status-icon.muted {
            color: var(--accent-red);
        }

        /* 浮動通話控制按鈕條 */
        .floating-action-bar {
            position: absolute;
            bottom: calc(16px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 24, 38, 0.85);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 8px 14px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            z-index: 100;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-width: 95vw;
        }

        .floating-action-bar.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 20px);
        }

        .call-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            outline: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: var(--bg-glass-btn);
            color: #ffffff;
            flex-shrink: 0;
        }

        .call-btn:active {
            transform: scale(0.92);
        }

        .call-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            pointer-events: none;
        }

        .call-btn.btn-screen.active {
            background: var(--accent);
            color: #fff;
        }

        .call-btn.btn-camera {
            background: #ffffff;
            color: #12151f;
        }
        .call-btn.btn-camera.off {
            background: var(--bg-glass-btn);
            color: #ffffff;
        }

        .call-btn.btn-mic {
            background: var(--bg-glass-btn);
            color: #ffffff;
        }
        .call-btn.btn-mic.off {
            background: rgba(242, 63, 67, 0.25);
            color: var(--accent-red);
            border: 1px solid rgba(242, 63, 67, 0.4);
        }

        .call-btn.btn-hangup {
            width: 50px;
            height: 50px;
            background: var(--accent-red);
            color: #ffffff;
            box-shadow: 0 6px 18px rgba(242, 63, 67, 0.45);
        }

        /* 模態彈窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            padding: 16px;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            width: 100%;
            max-width: 360px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-input {
            width: 100%;
            padding: 10px 12px;
            background: #111420;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .modal-btn {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .modal-btn.cancel { background: transparent; color: var(--text-secondary); }
        .modal-btn.confirm { background: var(--accent); color: #fff; }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(35, 165, 90, 0.95);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 1000;
            max-width: 90vw;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 768px) {
            .server-rail {
                display: none;
            }

            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                width: 280px;
                box-shadow: 4px 0 24px rgba(0,0,0,0.6);
                transform: translateX(-100%);
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .sidebar-backdrop.mobile-open {
                display: block;
            }

            .btn-menu-mobile {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .stage-header {
                padding: 0 12px;
            }

            .video-grid-container {
                padding: 10px 10px calc(80px + var(--safe-bottom)) 10px;
                grid-template-columns: 1fr !important;
                gap: 10px;
            }

            .video-tile {
                aspect-ratio: auto;
                height: 100%;
                min-height: 200px;
                max-height: 48vh;
            }

            .floating-action-bar {
                gap: 10px;
                padding: 6px 12px;
            }

            .call-btn {
                width: 44px;
                height: 44px;
            }

            .call-btn svg {
                width: 20px;
                height: 20px;
            }

            .call-btn.btn-hangup {
                width: 46px;
                height: 46px;
            }
        }
    </style>
</head>
<body>

    <!-- 伺服器圖示欄 (桌面端) -->
    <aside class="server-rail">
        <div class="server-icon active" title="Cobin 通話">
            <svg viewBox="0 0 24 24">

            </svg>
        </div>
        <div class="server-divider"></div>
    </aside>

    <!-- 手機側邊欄遮罩 -->
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleMobileSidebar()"></div>

    <!-- 頻道與房間側邊欄 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div style="display:flex; align-items:center;">
                <span class="status-badge-dot"></span>
                <span>語音房間</span>
            </div>
            <div id="wsStatusTag" style="font-size:11px; color:var(--accent-green); font-weight:600;">🟢 已連線</div>
        </div>

        <div class="channels-list">
            <div class="category-title">🔊 語音房間 (點擊進入)</div>

            <div class="room-item" id="room-item-room-1" onclick="handleRoomClick('room-1')">
                <div class="room-main-row">
                    <div class="room-info">
                        <svg class="room-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                        </svg>
                        <span>語音大廳 1</span>
                    </div>
                    <span class="room-count-badge" id="count-room-1">0 人</span>
                </div>
                <div class="room-users-sublist" id="users-room-1"></div>
            </div>

            <div class="room-item" id="room-item-room-2" onclick="handleRoomClick('room-2')">
                <div class="room-main-row">
                    <div class="room-info">
                        <svg class="room-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                        </svg>
                        <span>遊戲開黑 2</span>
                    </div>
                    <span class="room-count-badge" id="count-room-2">0 人</span>
                </div>
                <div class="room-users-sublist" id="users-room-2"></div>
            </div>

            <div class="room-item" id="room-item-room-3" onclick="handleRoomClick('room-3')">
                <div class="room-main-row">
                    <div class="room-info">
                        <svg class="room-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/>
                        </svg>
                        <span>私人會議 3</span>
                    </div>
                    <span class="room-count-badge" id="count-room-3">0 人</span>
                </div>
                <div class="room-users-sublist" id="users-room-3"></div>
            </div>
        </div>

        <div class="user-profile-bar">
            <div class="user-profile-info" onclick="openNicknameModal()" title="點擊修改暱稱">
                <div class="user-avatar-sm" id="myAvatarSm">U</div>
                <div class="user-text-col">
                    <div style="font-size:13px; font-weight:600;" id="myNicknameText">訪客</div>
                    <div style="font-size:11px; color:var(--text-muted);">點擊修改暱稱</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- 主通話舞台 -->
    <main class="main-stage">
        <!-- 右上角全局連線狀態燈 -->
        <div class="global-top-bar">
            <div class="global-status-pill" id="globalStatusPill">
                <span class="status-badge-dot"></span>
                <span id="globalStatusText">🟢 伺服器在線</span>
            </div>
        </div>

        <!-- 頂部通話標題列 -->
        <header class="stage-header" id="stageHeader" style="display:none;">
            <div class="stage-room-title">
                <button class="btn-menu-mobile" onclick="toggleMobileSidebar()">
                    <span>☰ 房間</span>
                </button>
                <span id="currentRoomNameTitle">語音大廳 1</span>
                <div class="call-duration">
                    <span class="status-badge-dot"></span>
                    <span id="callDurationTimer">00:00</span>
                </div>
            </div>
            <div id="roomParticipantsCount" style="font-size:12px; color:var(--text-secondary);">1 人在線</div>
        </header>

        <!-- 大廳畫面 -->
        <section class="lobby-screen" id="lobbyScreen">
            <div class="lobby-icon-box">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5zm4 4h-2v-2h2v2zm0-4h-2V7h2v5z"/>
                </svg>
            </div>
            <h2 class="lobby-title">加入語音與視訊通話</h2>
            <p class="lobby-desc">點擊下方任一房間即可立即開始通話，無須安裝任何外掛或軟體！</p>
            <div class="lobby-room-cards">
                <div class="lobby-card" onclick="handleRoomClick('room-1')">
                    <span style="font-size:22px;">🔊</span>
                    <div>
                        <div style="font-weight:600;">語音大廳 1</div>
                        <div style="font-size:11px; color:var(--text-muted);">休閒聊天</div>
                    </div>
                </div>
                <div class="lobby-card" onclick="handleRoomClick('room-2')">
                    <span style="font-size:22px;">🎮</span>
                    <div>
                        <div style="font-weight:600;">遊戲開黑 2</div>
                        <div style="font-size:11px; color:var(--text-muted);">組隊開麥</div>
                    </div>
                </div>
                <div class="lobby-card" onclick="handleRoomClick('room-3')">
                    <span style="font-size:22px;">💼</span>
                    <div>
                        <div style="font-weight:600;">私人會議 3</div>
                        <div style="font-size:11px; color:var(--text-muted);">工作討論</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 視訊畫面區域 Video Grid -->
        <section class="video-grid-container" id="videoGrid" style="display:none;">
            <div class="video-tile is-local" id="localVideoTile">
                <video id="localVideo" autoplay muted playsinline webkit-playsinline></video>
                <div class="avatar-placeholder" id="localAvatarPlaceholder" style="display:none;">
                    <div class="avatar-circle-lg" id="localAvatarCircle">U</div>
                    <div class="avatar-name-lg" id="localAvatarName">我 (本端)</div>
                </div>
                <div class="video-tag">
                    <svg class="mic-status-icon" id="localMicIndicator" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                    <span id="localTagLabel">我 (You)</span>
                </div>
            </div>
        </section>

        <!-- 底部浮動通話按鈕條 -->
        <div class="floating-action-bar hidden" id="floatingActionBar">
            <button class="call-btn btn-screen" id="btnShareScreen" title="螢幕分享" onclick="toggleScreenShare()">
                <svg viewBox="0 0 24 24">
                    <path d="M20 18c1.1 0 1.99-.9 1.99-2L22 5c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2H0c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2h-4zM4 5h16v11H4V5zm8 14c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
                </svg>
            </button>

            <button class="call-btn btn-invite" id="btnInvite" title="邀請好友" onclick="copyInviteLink()">
                <svg viewBox="0 0 24 24">
                    <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </button>

            <button class="call-btn btn-camera" id="btnCamera" title="開關鏡頭" onclick="toggleCamera()">
                <svg id="camIconOn" viewBox="0 0 24 24">
                    <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                </svg>
                <svg id="camIconOff" viewBox="0 0 24 24" style="display:none;">
                    <path d="M21 6.5l-4 4V7c0-.55-.45-1-1-1H9.82L21 17.18V6.5zM3.27 2L2 3.27 4.73 6H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.21 0 .39-.08.54-.18L19.73 21 21 19.73 3.27 2zM16 16.73L5.27 6H16v10.73z"/>
                </svg>
            </button>

            <button class="call-btn btn-mic" id="btnMic" title="開關麥克風" onclick="toggleMic()">
                <svg id="micIconOn" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
                <svg id="micIconOff" viewBox="0 0 24 24" style="display:none;">
                    <path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/>
                </svg>
            </button>

            <button class="call-btn btn-hangup" id="btnHangup" title="結束通話" onclick="leaveRoom()">
                <svg viewBox="0 0 24 24">
                    <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
                </svg>
            </button>
        </div>
    </main>

    <!-- 暱稱修改 Modal -->
    <div class="modal-overlay" id="nicknameModal">
        <div class="modal-box">
            <h3 style="font-size:17px; font-weight:700;">設定您的暱稱</h3>
            <input type="text" class="modal-input" id="nicknameInput" placeholder="請輸入暱稱..." maxlength="15" />
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeNicknameModal()">取消</button>
                <button class="modal-btn confirm" onclick="saveNickname()">儲存</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toastMsg">已複製房間連結</div>

    <script>
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            const isOpen = sidebar.classList.contains('mobile-open');
            if (isOpen) {
                sidebar.classList.remove('mobile-open');
                backdrop.classList.remove('mobile-open');
            } else {
                sidebar.classList.add('mobile-open');
                backdrop.classList.add('mobile-open');
            }
        }

        function handleRoomClick(roomId) {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            if (sidebar.classList.contains('mobile-open')) {
                sidebar.classList.remove('mobile-open');
                backdrop.classList.remove('mobile-open');
            }
            if (window.joinRoom) {
                window.joinRoom(roomId);
            }
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
