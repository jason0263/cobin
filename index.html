<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord‑Like WebRTC Demo</title>
    <meta name="description" content="Real‑time chat and WebRTC screen‑share/video call powered by PHP Workerman signalling server." />
    <style>
        :root {
            --bg-dark: hsl(210, 15%, 12%);
            --bg-card: hsla(210, 15%, 20%, 0.6);
            --accent: hsl(227, 85%, 65%);
            --text-primary: hsl(0, 0%, 95%);
            --text-secondary: hsl(0, 0%, 70%);
            --blur: 12px;
            font-family: 'Inter', system-ui, sans-serif;
        }
        body {
            margin: 0;
            background: var(--bg-dark);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            padding: 1rem 2rem;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(var(--blur));
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        h1 {margin:0; font-size:1.5rem;}
        main {
            flex:1;
            display: flex;
            gap: 1rem;
            padding: 1rem;
        }
        .chat {
            flex: 1 1 300px;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(var(--blur));
        }
        .messages {
            flex:1;
            overflow-y:auto;
            padding: 0.5rem;
        }
        .msg {
            margin: 0.3rem 0;
        }
        .msg .author {font-weight:bold; color: var(--accent);}
        .input-bar {
            display:flex;
            padding:0.5rem;
            border-top:1px solid rgba(255,255,255,0.1);
        }
        .input-bar input {
            flex:1;
            padding:0.5rem;
            border:none;
            border-radius:6px;
            margin-right:0.5rem;
        }
        .input-bar button {
            padding:0.5rem 1rem;
            background: var(--accent);
            border:none;
            border-radius:6px;
            color:#fff;
            cursor:pointer;
            transition: background 0.2s;
        }
        .input-bar button:hover {background:hsl(227,85%,55%);}
        .video-panel {
            flex: 2 1 500px;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(var(--blur));
        }
        .videos {
            flex:1;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#000;
            position:relative;
        }
        video {
            max-width:100%;
            max-height:100%;
            border-radius:8px;
        }
        .controls {
            padding:0.5rem;
            display:flex;
            gap:0.5rem;
            justify-content:center;
            background:#111;
        }
        .controls button {
            padding:0.4rem 0.8rem;
            background: var(--accent);
            border:none;
            border-radius:6px;
            color:#fff;
            cursor:pointer;
            transition:background 0.2s;
        }
        .controls button:hover {background:hsl(227,85%,55%);}
        ::-webkit-scrollbar {
            width:8px;
        }
        ::-webkit-scrollbar-thumb {
            background:rgba(255,255,255,0.2);
            border-radius:4px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Discord‑Like WebRTC Demo</h1>
        <div id="status">🔌 Disconnected</div>
    </header>
    <main>
        <section class="chat">
            <div class="messages" id="messages"></div>
            <div class="input-bar">
                <input type="text" id="msgInput" placeholder="Type a message..." />
                <button id="sendBtn">Send</button>
            </div>
        </section>
        <section class="video-panel">
            <div class="videos">
                <video id="localVideo" autoplay muted playsinline></video>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
            <div class="controls">
                <button id="callBtn">Start Call</button>
                <button id="shareBtn">Share Screen</button>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
